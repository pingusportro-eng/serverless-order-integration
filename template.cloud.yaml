AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Deployable serverless order integration stack

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
    Description: Short environment label used in tags and resource descriptions.
  MerchantId:
    Type: String
    Default: mrc_demo
    AllowedPattern: '^mrc_[A-Za-z0-9]+$'
    Description: Fixed learning tenant mapped from authenticated test identities.
  CursorSigningSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC secret for opaque order-list cursors; never commit its deployed value.
  WebhookSigningSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Shared HMAC secret for provider webhooks; never commit its deployed value.
  WebhookToleranceSeconds:
    Type: Number
    Default: 300
    MinValue: 30
    MaxValue: 900
    Description: Maximum accepted difference between webhook and server timestamps.
  LogRetentionDays:
    Type: Number
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
    Description: Cost-reviewed CloudWatch Logs retention selected before deployment.
  ApiThrottleBurstLimit:
    Type: Number
    MinValue: 1
    Description: Cost-reviewed maximum HTTP API burst selected before deployment.
  ApiThrottleRateLimit:
    Type: Number
    MinValue: 1
    Description: Cost-reviewed steady HTTP API request rate selected before deployment.
  DynamoMaxReadRequestUnits:
    Type: Number
    MinValue: 1
    Description: Cost-reviewed maximum on-demand reads per second for the table and indexes.
  DynamoMaxWriteRequestUnits:
    Type: Number
    MinValue: 1
    Description: Cost-reviewed maximum on-demand writes per second for the table and indexes.
  StreamPublisherBatchSize:
    Type: Number
    MinValue: 1
    MaxValue: 1000
    Description: Cost-reviewed maximum DynamoDB Stream records per publisher invocation.
  StreamPublisherMaximumRetryAttempts:
    Type: Number
    MinValue: 0
    MaxValue: 10000
    Description: Cost-reviewed retries before a failed stream record is discarded to SQS.
  StreamPublisherMaximumRecordAgeSeconds:
    Type: Number
    MinValue: 60
    MaxValue: 86400
    Description: Cost-reviewed stream record age before it is discarded to SQS.
  DeliveryWorkerBatchSize:
    Type: Number
    MinValue: 1
    MaxValue: 10
    Description: Cost-reviewed maximum SQS messages processed sequentially per worker invocation.
  DeliveryWorkerMaximumConcurrency:
    Type: Number
    MinValue: 2
    MaxValue: 10
    Description: Cost-reviewed upper bound on concurrent delivery worker invocations.
  DeliveryWorkerTimeoutSeconds:
    Type: Number
    MinValue: 1
    MaxValue: 60
    Description: Cost-reviewed Lambda timeout for one delivery batch.
  DeliveryQueueVisibilityTimeoutSeconds:
    Type: Number
    MinValue: 6
    MaxValue: 43200
    Description: Cost-reviewed time failed or in-flight delivery messages remain hidden.
  DeliveryQueueMaxReceiveCount:
    Type: Number
    MinValue: 2
    MaxValue: 10
    Description: Cost-reviewed delivery attempts before a message moves to the worker DLQ.
  DeliveryMessageRetentionSeconds:
    Type: Number
    MinValue: 60
    MaxValue: 1209600
    Description: Cost-reviewed retention for pending delivery messages.
  FailureMessageRetentionSeconds:
    Type: Number
    MinValue: 60
    MaxValue: 1209600
    Description: Cost-reviewed retention shared by all retained failure queues.
  VendorBaseUrl:
    Type: String
    AllowedPattern: '^https://.+'
    Description: Public HTTPS base URL of the reviewed delivery vendor used by the cloud worker.
  VendorAuthToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Bearer token for the learning delivery vendor; never commit its deployed value.
  VendorTimeoutMs:
    Type: Number
    MinValue: 100
    MaxValue: 55000
    Description: Cost-reviewed HTTP timeout for one vendor submission attempt.
  StripeTimeoutMs:
    Type: Number
    MinValue: 100
    MaxValue: 55000
    Description: Cost-reviewed HTTP timeout for one Stripe API request.

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    MemorySize: 128
    Timeout: 10
    PropagateTags: true
    Tags:
      Project: serverless-order-integration
      Environment: !Ref EnvironmentName

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      DeletionProtectionEnabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      OnDemandThroughput:
        MaxReadRequestUnits: !Ref DynamoMaxReadRequestUnits
        MaxWriteRequestUnits: !Ref DynamoMaxWriteRequestUnits
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byMerchantCreatedAt
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          OnDemandThroughput:
            MaxReadRequestUnits: !Ref DynamoMaxReadRequestUnits
            MaxWriteRequestUnits: !Ref DynamoMaxWriteRequestUnits
        - IndexName: byMerchantStatusCreatedAt
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          OnDemandThroughput:
            MaxReadRequestUnits: !Ref DynamoMaxReadRequestUnits
            MaxWriteRequestUnits: !Ref DynamoMaxWriteRequestUnits
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolTier: LITE
      DeletionProtection: INACTIVE
      MfaConfiguration: 'OFF'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 1
      UserPoolTags:
        Project: serverless-order-integration
        Environment: !Ref EnvironmentName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
      CallbackURLs:
        - http://127.0.0.1:3002/auth/callback
      LogoutURLs:
        - http://127.0.0.1:3002/
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Domain: !Sub serverless-order-integration-${AWS::AccountId}-${EnvironmentName}
      ManagedLoginVersion: 1
      UserPoolId: !Ref UserPool

  OperatorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: operators
      Description: Synthetic operators allowed to invoke controlled status changes.

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/serverless-order-integration/${AWS::StackName}/api-access
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName

  OrdersApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/serverless-order-integration/${AWS::StackName}/orders-api
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName

  VendorWebhookLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/serverless-order-integration/${AWS::StackName}/vendor-webhook
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName

  StreamPublisherLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/serverless-order-integration/${AWS::StackName}/stream-publisher
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName

  DeliveryWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/serverless-order-integration/${AWS::StackName}/delivery-worker
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName

  DomainEventsTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DisplayName: Serverless order domain events
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName

  StreamPublisherFailureQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      MessageRetentionPeriod: !Ref FailureMessageRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: FailurePath
          Value: stream-publisher

  DeliverySubscriptionDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      MessageRetentionPeriod: !Ref FailureMessageRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: FailurePath
          Value: sns-subscription

  DeliverySubscriptionDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DeliverySubscriptionDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDomainEventsTopicFailureDelivery
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt DeliverySubscriptionDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref DomainEventsTopic
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  DeliveryDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      MessageRetentionPeriod: !Ref FailureMessageRetentionSeconds
      RedriveAllowPolicy:
        redrivePermission: allowAll
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: FailurePath
          Value: delivery-worker

  DeliveryQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      MessageRetentionPeriod: !Ref DeliveryMessageRetentionSeconds
      VisibilityTimeout: !Ref DeliveryQueueVisibilityTimeoutSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeliveryDeadLetterQueue.Arn
        maxReceiveCount: !Ref DeliveryQueueMaxReceiveCount
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: serverless-order-integration
        - Key: Environment
          Value: !Ref EnvironmentName

  DeliveryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DeliveryQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDomainEventsTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt DeliveryQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref DomainEventsTopic
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  DeliverySubscription:
    Type: AWS::SNS::Subscription
    DependsOn:
      - DeliveryQueuePolicy
      - DeliverySubscriptionDeadLetterQueuePolicy
    Properties:
      TopicArn: !Ref DomainEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt DeliveryQueue.Arn
      RawMessageDelivery: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeliverySubscriptionDeadLetterQueue.Arn
      FilterPolicyScope: MessageAttributes
      FilterPolicy:
        eventType:
          - order.ready_for_submission
          - order.submission_retry_requested

  SynchronousHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      FailOnWarnings: true
      CorsConfiguration:
        AllowOrigins:
          - http://127.0.0.1:3002
        AllowHeaders:
          - Authorization
          - Content-Type
          - Idempotency-Key
          - If-Match
          - X-Correlation-Id
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        MaxAge: 600
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: !Sub ${AWS::StackName}-http-api
          version: '1.0'
        paths: {}
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
              audience:
                - !Ref UserPoolClient
      AccessLogSettings:
        DestinationArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiAccessLogGroup}
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","responseLength":"$context.responseLength","integrationStatus":"$context.integration.status"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit
      Tags:
        Project: serverless-order-integration
        Environment: !Ref EnvironmentName

  OrdersApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: orders-api.handler
      Description: Authenticated order REST operations for the fixed learning tenant.
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref OrdersApiLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          MERCHANT_ID: !Ref MerchantId
          CURSOR_SIGNING_SECRET: !Ref CursorSigningSecret
          REQUIRE_ACCESS_TOKEN: 'true'
          REQUIRE_OPERATOR_GROUP: 'true'
          SECRET_PROVIDER: ssm
          STRIPE_SECRET_KEY_PARAMETER_NAME: !Sub /serverless-order-integration/${EnvironmentName}/stripe/secret-key
          STRIPE_TIMEOUT_MS: !Ref StripeTimeoutMs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadOrders
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt OrdersTable.Arn
            - Sid: QueryOrderIndexes
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub ${OrdersTable.Arn}/index/*
            - Sid: WriteOrders
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OrdersTable.Arn
              Condition:
                ForAnyValue:StringEquals:
                  dynamodb:EnclosingOperation:
                    - TransactWriteItems
            - Sid: ReadStripeSecretKeyParameter
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/serverless-order-integration/${EnvironmentName}/stripe/secret-key
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref SynchronousHttpApi
            Method: POST
            Path: /orders
            PayloadFormatVersion: '2.0'
        ListOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref SynchronousHttpApi
            Method: GET
            Path: /orders
            PayloadFormatVersion: '2.0'
        GetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref SynchronousHttpApi
            Method: GET
            Path: /orders/{orderId}
            PayloadFormatVersion: '2.0'
        PreparePaymentIntent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SynchronousHttpApi
            Method: POST
            Path: /orders/{orderId}/payment-intents
            PayloadFormatVersion: '2.0'
        ChangeOrderStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref SynchronousHttpApi
            Method: PATCH
            Path: /orders/{orderId}/status
            PayloadFormatVersion: '2.0'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda/orders-api.ts
        Format: cjs
        Minify: true
        Sourcemap: true
        Target: es2022

  VendorWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: vendor-webhook.handler
      Description: Public provider webhook protected by HMAC and durable event deduplication.
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref VendorWebhookLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          WEBHOOK_SIGNING_SECRET: !Ref WebhookSigningSecret
          WEBHOOK_TOLERANCE_SECONDS: !Ref WebhookToleranceSeconds
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadWebhookOrder
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt OrdersTable.Arn
            - Sid: RecordWebhook
              Effect: Allow
              Action:
                - dynamodb:ConditionCheckItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OrdersTable.Arn
              Condition:
                ForAnyValue:StringEquals:
                  dynamodb:EnclosingOperation:
                    - TransactWriteItems
      Events:
        VendorWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref SynchronousHttpApi
            Method: POST
            Path: /webhooks/vendor
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda/vendor-webhook.ts
        Format: cjs
        Minify: true
        Sourcemap: true
        Target: es2022

  StreamPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: stream-publisher.handler
      Description: Converts committed order changes into versioned SNS domain events.
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref StreamPublisherLogGroup
      Environment:
        Variables:
          DOMAIN_EVENTS_TOPIC_ARN: !Ref DomainEventsTopic
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadOrdersStream
              Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
              Resource: !GetAtt OrdersTable.StreamArn
            - Sid: ListOrdersStreams
              Effect: Allow
              Action:
                - dynamodb:ListStreams
              Resource: '*'
            - Sid: PublishDomainEvents
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref DomainEventsTopic
            - Sid: RetainDiscardedStreamRecords
              Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt StreamPublisherFailureQueue.Arn
      Events:
        OrdersStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt OrdersTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: !Ref StreamPublisherBatchSize
            BisectBatchOnFunctionError: true
            Enabled: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            MaximumRecordAgeInSeconds: !Ref StreamPublisherMaximumRecordAgeSeconds
            MaximumRetryAttempts: !Ref StreamPublisherMaximumRetryAttempts
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt StreamPublisherFailureQueue.Arn
            FilterCriteria:
              Filters:
                - Pattern: >-
                    {"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"entityType":{"S":["ORDER"]}}}}
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda/stream-publisher.ts
        Format: cjs
        Minify: true
        Sourcemap: true
        Target: es2022

  DeliveryWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: delivery-worker.handler
      Description: Processes actionable order events and submits deliveries to the vendor.
      Timeout: !Ref DeliveryWorkerTimeoutSeconds
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref DeliveryWorkerLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          VENDOR_BASE_URL: !Ref VendorBaseUrl
          VENDOR_AUTH_TOKEN: !Ref VendorAuthToken
          VENDOR_TIMEOUT_MS: !Ref VendorTimeoutMs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ConsumeDeliveryMessages
              Effect: Allow
              Action:
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ReceiveMessage
              Resource: !GetAtt DeliveryQueue.Arn
            - Sid: ReadDeliveryOrders
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt OrdersTable.Arn
            - Sid: RecordDeliveryOutcomes
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OrdersTable.Arn
              Condition:
                ForAnyValue:StringEquals:
                  dynamodb:EnclosingOperation:
                    - TransactWriteItems
      Events:
        DeliveryMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt DeliveryQueue.Arn
            BatchSize: !Ref DeliveryWorkerBatchSize
            Enabled: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: !Ref DeliveryWorkerMaximumConcurrency
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda/delivery-worker.ts
        Format: cjs
        Minify: true
        Sourcemap: true
        Target: es2022

Outputs:
  ApiUrl:
    Description: Regional API Gateway HTTP API endpoint.
    Value: !Sub https://${SynchronousHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  OrdersTableName:
    Description: DynamoDB table used by the synchronous application slice.
    Value: !Ref OrdersTable
  UserPoolId:
    Description: Cognito user pool for synthetic merchant and operator users.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public Cognito app client ID used to obtain test access tokens.
    Value: !Ref UserPoolClient
  UserPoolDomainUrl:
    Description: Cognito prefix-domain origin used by the browser PKCE flow.
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  UserPoolIssuer:
    Description: JWT issuer configured on the HTTP API authorizer.
    Value: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
  StripeSecretKeyParameterName:
    Description: Stable Standard SecureString parameter read by the Orders API.
    Value: !Sub /serverless-order-integration/${EnvironmentName}/stripe/secret-key
  OrdersTableStreamArn:
    Description: DynamoDB Stream consumed by the domain-event publisher.
    Value: !GetAtt OrdersTable.StreamArn
  DomainEventsTopicArn:
    Description: SNS topic carrying every published order domain event.
    Value: !Ref DomainEventsTopic
  DeliveryQueueUrl:
    Description: SQS queue containing actionable delivery events.
    Value: !Ref DeliveryQueue
  DeliveryDeadLetterQueueUrl:
    Description: SQS queue retaining delivery messages that exhausted their attempts.
    Value: !Ref DeliveryDeadLetterQueue
  StreamPublisherFailureQueueUrl:
    Description: SQS queue retaining discarded DynamoDB Stream records.
    Value: !Ref StreamPublisherFailureQueue
  DeliverySubscriptionDeadLetterQueueUrl:
    Description: SQS queue retaining domain events that SNS could not deliver.
    Value: !Ref DeliverySubscriptionDeadLetterQueue
