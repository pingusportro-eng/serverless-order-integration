openapi: 3.0.3

info:
  title: Serverless Order Integration API
  version: 0.1.0
  description: |
    Contract for creating and inspecting synthetic delivery orders, performing
    controlled operator status changes, and receiving mock-provider webhooks.

    Merchant identity is derived from the authenticated client. A caller cannot
    select an arbitrary `merchantId` in a request body.

    Application-generated error responses use RFC 9457 Problem Details. The
    `code` extension is the stable machine-readable application error; clients
    must not parse `detail`. Responses generated before Lambda invocation, such
    as API Gateway throttling, use the platform's native error shape.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Orders
    description: Merchant order operations
  - name: Operations
    description: Authorized operator actions
  - name: Provider webhooks
    description: Callbacks from the mock delivery provider

paths:
  /orders:
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create an order
      description: |
        Creates one order and schedules provider submission asynchronously.
        The authenticated identity supplies the merchant context.

        A repeated idempotency key with an identical canonical request returns
        the original order. Reusing a key with different business values is a
        conflict.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: A new order was created.
          headers:
            Location:
              description: Relative URL of the created order.
              schema:
                type: string
                example: /orders/ord_01JABCDEF0123456789
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              description: Indicates whether the response replays an earlier request.
              schema:
                type: boolean
                example: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: The same idempotent request was processed previously.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              description: Always true for this response.
              schema:
                type: boolean
                enum:
                  - true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/PlatformRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - Orders
      operationId: listOrders
      summary: List orders
      description: |
        Returns orders belonging to the authenticated merchant, newest first.
        Ordering is stable by creation time and order ID. The cursor is opaque
        and must be returned unchanged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/OrderStatusFilter'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A bounded page of orders.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/PlatformRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Get an order
      description: |
        Returns an order belonging to the authenticated merchant. An unknown
        order and an order owned by another merchant both produce `404` to avoid
        exposing tenant information.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The current order representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '429':
          $ref: '#/components/responses/PlatformRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    patch:
      tags:
        - Operations
      operationId: changeOrderStatus
      summary: Request an operator status change
      description: |
        Performs a controlled recovery, cancellation, or provider
        reconciliation. The bearer identity must have operator authorization.

        `If-Match` contains the order version observed by the operator. A stale
        version fails without changing the order. The requested transition must
        also be allowed by the domain state machine.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderStatusRequest'
      responses:
        '200':
          description: The status change was applied.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/PlatformRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks/vendor:
    post:
      tags:
        - Provider webhooks
      operationId: receiveProviderWebhook
      summary: Receive a provider status event
      description: |
        Authenticates the signature over the timestamp and raw request body,
        deduplicates by provider event ID, and applies a valid state transition.

        A duplicate event that was processed successfully returns `204` without
        applying the side effect again. A stale event also returns `204` after
        being recorded for operational visibility.
      security:
        - webhookSignature: []
      parameters:
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderWebhookRequest'
      responses:
        '204':
          description: The event was applied, was already processed, or was stale.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidWebhookSignature'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/PlatformRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito access token validated by an API Gateway HTTP API JWT authorizer.
        Application logic maps the approved merchant identity to the fixed MVP
        tenant and requires the `operators` group for operator routes.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256 signature formatted as `sha256=<lowercase hex>`.

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Opaque platform order identifier.
      schema:
        $ref: '#/components/schemas/OrderId'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated key scoped to the authenticated merchant. It is
        retained for the lifetime of the MVP environment.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
        example: order-create-018f5f4e

    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Optional caller trace reference. The service generates one when absent
        and propagates the accepted value through downstream processing.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
        example: corr_01JABCDEF0123456789

    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of orders to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token returned by the preceding page.
      schema:
        type: string
        minLength: 1
        maxLength: 2048

    OrderStatusFilter:
      name: status
      in: query
      required: false
      description: Return only orders with this current status.
      schema:
        $ref: '#/components/schemas/OrderStatus'

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the order version observed by the caller.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"3"'

    WebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      required: true
      description: Unix time in seconds included in the signed webhook message.
      schema:
        type: string
        pattern: '^[0-9]{10}$'
        example: '1784637045'

  headers:
    ETag:
      description: Strong entity tag containing the current order version.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"3"'

    RequestId:
      description: Unique identifier for this HTTP request.
      schema:
        type: string
        example: req_01JABCDEF0123456789

  schemas:
    OrderId:
      type: string
      minLength: 12
      maxLength: 64
      pattern: '^ord_[A-Za-z0-9]+$'
      example: ord_01JABCDEF0123456789

    MerchantId:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^mrc_[A-Za-z0-9]+$'
      example: mrc_demo

    OrderStatus:
      type: string
      enum:
        - PENDING_SUBMISSION
        - SUBMISSION_FAILED
        - SUBMITTED
        - PICKED_UP
        - DELIVERED
        - DELIVERY_FAILED
        - CANCELLED

    Money:
      type: object
      additionalProperties: false
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Amount in the currency's minor unit.
          example: 1299
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: EUR

    OrderLine:
      type: object
      additionalProperties: false
      required:
        - itemReference
        - description
        - quantity
        - unitPrice
      properties:
        itemReference:
          type: string
          minLength: 1
          maxLength: 100
          example: pizza-margherita
        description:
          type: string
          minLength: 1
          maxLength: 200
          example: Synthetic margherita pizza
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          example: 2
        unitPrice:
          $ref: '#/components/schemas/Money'

    DeliveryLocation:
      type: object
      additionalProperties: false
      required:
        - addressLine
        - city
        - postalCode
        - countryCode
      properties:
        addressLine:
          type: string
          minLength: 1
          maxLength: 200
          example: 10 Example Street
        city:
          type: string
          minLength: 1
          maxLength: 100
          example: Bucharest
        postalCode:
          type: string
          minLength: 1
          maxLength: 20
          example: '010101'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          example: RO

    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - merchantOrderReference
        - items
        - pickup
        - dropoff
      properties:
        merchantOrderReference:
          type: string
          minLength: 1
          maxLength: 100
          example: pos-order-10042
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderLine'
        pickup:
          $ref: '#/components/schemas/DeliveryLocation'
        dropoff:
          $ref: '#/components/schemas/DeliveryLocation'

    ProviderSummary:
      type: object
      additionalProperties: false
      required:
        - providerCode
      properties:
        providerCode:
          type: string
          enum:
            - mock-delivery
        providerOrderId:
          type: string
          minLength: 1
          maxLength: 128
          example: delivery-789
        acceptedAt:
          type: string
          format: date-time
          example: '2026-07-21T12:30:45.123Z'

    FailureDetails:
      type: object
      additionalProperties: false
      required:
        - stage
        - reasonCode
        - summary
        - occurredAt
      properties:
        stage:
          type: string
          enum:
            - SUBMISSION
            - DELIVERY
        reasonCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: RECIPIENT_UNAVAILABLE
        summary:
          type: string
          minLength: 1
          maxLength: 500
          example: Mock recipient could not be reached.
        occurredAt:
          type: string
          format: date-time
          example: '2026-07-21T13:00:00.000Z'

    Order:
      type: object
      additionalProperties: false
      required:
        - orderId
        - merchantId
        - merchantOrderReference
        - status
        - items
        - total
        - pickup
        - dropoff
        - provider
        - createdAt
        - updatedAt
        - version
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantOrderReference:
          type: string
          minLength: 1
          maxLength: 100
          example: pos-order-10042
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          $ref: '#/components/schemas/Money'
        pickup:
          $ref: '#/components/schemas/DeliveryLocation'
        dropoff:
          $ref: '#/components/schemas/DeliveryLocation'
        provider:
          $ref: '#/components/schemas/ProviderSummary'
        failure:
          $ref: '#/components/schemas/FailureDetails'
        createdAt:
          type: string
          format: date-time
          example: '2026-07-21T12:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-07-21T12:30:45.123Z'
        version:
          type: integer
          minimum: 1
          example: 2

    OrderPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
          description: Absent when there is no following page.

    ChangeOrderStatusRequest:
      type: object
      additionalProperties: false
      required:
        - targetStatus
        - reason
      properties:
        targetStatus:
          type: string
          description: |
            Requested operator-controlled target. It must be valid from the
            current state. `PENDING_SUBMISSION` is only for approved submission
            recovery; later delivery states are provider reconciliation.
          enum:
            - PENDING_SUBMISSION
            - SUBMITTED
            - PICKED_UP
            - DELIVERED
            - DELIVERY_FAILED
            - CANCELLED
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Audit-safe reason for the operator action.
          example: Reconciled against the mock provider response.
        providerOrderId:
          type: string
          minLength: 1
          maxLength: 128
          description: Required when reconciliation first confirms provider acceptance.
          example: delivery-789
        failure:
          allOf:
            - $ref: '#/components/schemas/FailureDetails'
          description: Required when the target status is `DELIVERY_FAILED`.

    ProviderWebhookRequest:
      type: object
      additionalProperties: false
      required:
        - eventId
        - eventType
        - occurredAt
        - providerOrderId
      properties:
        eventId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          example: provider-event-1007
        eventType:
          type: string
          enum:
            - DELIVERY_PICKED_UP
            - DELIVERY_DELIVERED
            - DELIVERY_FAILED
            - DELIVERY_CANCELLED
        occurredAt:
          type: string
          format: date-time
          example: '2026-07-21T13:00:00.000Z'
        providerOrderId:
          type: string
          minLength: 1
          maxLength: 128
          example: delivery-789
        failure:
          allOf:
            - $ref: '#/components/schemas/FailureDetails'
          description: Required when `eventType` is `DELIVERY_FAILED`.

    ValidationIssue:
      type: object
      additionalProperties: false
      required:
        - detail
        - pointer
      properties:
        detail:
          type: string
          description: Human-readable explanation of this invalid value.
          example: must be greater than or equal to 1
        pointer:
          type: string
          description: JSON Pointer locating the invalid request value.
          example: '#/items/0/quantity'

    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable URI identifying the problem type.
          example: https://example.invalid/problems/validation-error
        title:
          type: string
          description: Stable human-readable summary of the problem type.
          example: Request validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code returned with this body.
          example: 422
        detail:
          type: string
          description: Safe explanation specific to this occurrence.
          example: One or more request values are invalid.
        instance:
          type: string
          format: uri-reference
          description: Opaque URI identifying this problem occurrence.
          example: /problems/req_01JABCDEF0123456789
        code:
          type: string
          description: |
            Stable application code. Defined values include
            `MALFORMED_REQUEST`, `UNAUTHORIZED`, `FORBIDDEN`,
            `INVALID_WEBHOOK_SIGNATURE`, `ORDER_NOT_FOUND`,
            `IDEMPOTENCY_CONFLICT`, `MERCHANT_REFERENCE_CONFLICT`,
            `INVALID_STATUS_TRANSITION`, `EVENT_ID_CONFLICT`,
            `VERSION_MISMATCH`, `PRECONDITION_REQUIRED`, `VALIDATION_ERROR`,
            and `INTERNAL_ERROR`.
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: VALIDATION_ERROR
        requestId:
          type: string
          description: Request reference safe to provide to support.
          example: req_01JABCDEF0123456789
        errors:
          type: array
          description: Individual value errors, present for validation failures.
          items:
            $ref: '#/components/schemas/ValidationIssue'

  responses:
    BadRequest:
      description: The request is malformed or a required header cannot be parsed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: Authentication is absent or invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    InvalidWebhookSignature:
      description: The webhook signature or timestamp is absent, invalid, or expired.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: The authenticated identity is not authorized for this operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    OrderNotFound:
      description: The order does not exist or is not visible to this merchant.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: The request conflicts with idempotency, uniqueness, event, or state rules.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    VersionMismatch:
      description: The supplied ETag does not match the current order version.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    PreconditionRequired:
      description: "`If-Match` is required for this mutation."
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ValidationFailed:
      description: The request is well-formed but violates value or business validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    PlatformRateLimited:
      description: |
        API Gateway rejected the request before Lambda invocation because an
        applicable throttle was exceeded. This platform response does not use
        the application's Problem Details contract.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: Service-native API Gateway error body.

    InternalError:
      description: An unexpected internal failure occurred.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
