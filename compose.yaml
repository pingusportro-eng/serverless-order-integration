name: serverless-order-integration

services:
  dynamodb-local:
    image: amazon/dynamodb-local:3.3.0
    # Fresh named volumes are root-owned; this lets SQLite initialize the data file.
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--output', '/dev/null', 'http://localhost:8000']
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 2s
    restart: 'no'

volumes:
  dynamodb-data:
