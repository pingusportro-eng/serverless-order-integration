name: Pull request checks

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Local quality and integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Build TypeScript
        run: npm run build

      - name: Run DynamoDB Local integration tests
        env:
          COMPOSE_PROJECT_NAME: serverless-order-integration-ci
        run: npm run test:integration

      - name: Remove local integration resources
        if: always()
        env:
          COMPOSE_PROJECT_NAME: serverless-order-integration-ci
        run: docker compose down --volumes

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}

      - name: Validate the local SAM template
        run: npm run sam:validate

      - name: Validate the deployable SAM template
        run: npm run sam:cloud:validate

      - name: Validate the GitHub OIDC bootstrap
        run: npm run oidc:validate

      - name: Build the deployable SAM application
        run: npm run sam:cloud:build
